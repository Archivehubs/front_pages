<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ArchiveHubs</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="forgot-password-container">
        <div class="forgot-password-card">
            <div class="logo-container">
                <img src="images/Logo.jpg" alt="ArchiveHubs Logo">
            </div>
            
            <h1 class="forgot-password-title">Forgot Password?</h1>
            <p class="forgot-password-description">
                Enter your email address and we'll send you instructions to reset your password.
            </p>

            <form id="forgot-password-form">
                <div class="form-group">
                    <span class="error-message"></span>
                    <label for="email">Email address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <a href="reset-password.html">
                    <button type="submit" class="submit-btn">
                        Send Reset Link
                    </button>
                </a>
            </form>

            <div class="back-to-login">
                <a href="sign-in_account.html">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://api.archivehubs.com';
        document.getElementById('forgot-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorMsg = document.querySelector('.error-message');
            const btn = document.querySelector('.submit-btn');

            btn.innerText = 'Sending...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                else if(response.status === 404){
                    errorMsg.textContent = 'No account found with that email address.';
                    errorMsg.style.display = 'block';
                    return;
                }

                else if(response.status === 201){
                    alert('An email has been sent with instructions to reset your password.');
                    window.location.href = 'sign-in_account.html';
                }

            } catch (error) {
                errorMsg.textContent = 'An error occurred. Please try again later.';
                errorMsg.style.display = 'block';
            } finally {
                btn.innerText = 'Send Reset Link';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

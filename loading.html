<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6fa;
            margin: 0;
            overflow: hidden;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ffc107; /* Yellow color */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>

    <script>
        const BASE_URL = 'https://api.archivehubs.com';
        window.onload = async function() {
            const response = await fetch(`${BASE_URL}/user`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
            });

            if (response.ok){
                setTimeout(function() {
                    window.location.href = 'home.html';
                }, 4000); // 4000 milliseconds = 4 seconds
            } else {
                window.location.href = 'sign-in_account.html';
            }
        }
    </script>
</body>
</html>

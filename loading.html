<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6fa;
            margin: 0;
            overflow: hidden;
            flex-direction: column;
            padding: 20px;
        }
        
        .logo-container {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .logo-container img {
            max-width: 200px;
            height: auto;
        }
        
        .progress-container {
            width: 300px;
            height: 4px;
            background-color: #f3f3f3;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #ffc107;
            border-radius: 10px;
            animation: load 4s linear forwards;
        }
        
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #666;
            text-align: center;
        }
        
        /* Default logo (you can replace this with your actual logo) */
        .default-logo {
            width: 120px;
            height: 120px;
            background-color: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }
        
        /* Add dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
            }
            
            .loading-text {
                color: #e4e6eb;
            }
            
            .progress-container {
                background-color: #3a3b3c;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">       
       <img src="images/Logo.jpg" alt="ArchiveHubs Logo">
    </div>
    
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
    
    <div class="loading-text">Loading your experience...</div>

    <script>
        const BASE_URL = 'http://localhost:3000';
        
        window.onload = async function() {
            try {
                const response = await fetch(`${BASE_URL}/user`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                });
                
                if (response.ok) {
                    setTimeout(function() {
                        window.location.href = 'home.html';
                    }, 4000);
                } else {
                    window.location.href = 'sign-in_account.html';
                }
            } catch (error) {
                console.error('Error:', error);
                window.location.href = 'sign-in_account.html';
            }
        }
    </script>
</body>
</html>

<!-- create-new-listing.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Listing | Corporate Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <!-- Same, active for Create New Listing -->
    </aside>

    <main class="main-content">
        <div class="insight-section">
            <div class="header">
                <h3>Create New Listing</h3>
            </div>
            <form>
                <label>Listing Title</label>
                <input type="text" placeholder="Enter title">
                <label>Description</label>
                <textarea placeholder="Enter description"></textarea>
                <label>Price</label>
                <input type="number" placeholder="Enter price">
                <button class="primary-btn">Submit Listing</button>
            </form>
            <div class="no-data">Fill the form to create a new listing.</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>

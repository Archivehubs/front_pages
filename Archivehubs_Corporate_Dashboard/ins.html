<!-- insight.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight | Corporate Dashboard</title>

    <!-- Font & Icon Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Your Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <!-- Active for Insight -->
    </aside>

    <main class="main-content">
        <div class="insight-section">
            <div class="header">
                <h3>Insight</h3>
            </div>

            <div class="chart-container">
                <canvas id="insightChart"></canvas>
            </div>

            <div class="no-data">
                No Data Available<br>Activity will generate insights.
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', () => {
            // Get CSS variable for color
            const rootStyles = getComputedStyle(document.documentElement);
            const primaryColor = rootStyles.getPropertyValue('--primary-color').trim() || '#3498db'; // fallback color

            // Initialize Chart.js
            const ctx = document.getElementById('insightChart');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'],
                    datasets: [{
                        label: 'Metrics',
                        data: [0, 0, 0, 0, 0, 0, 0],
                        borderColor: primaryColor,
                        backgroundColor: primaryColor + '33', // translucent fill
                        borderWidth: 2,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#555',
                                font: {
                                    family: 'Poppins'
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#777',
                                font: { family: 'Poppins' }
                            },
                            grid: { color: '#eee' }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#777',
                                font: { family: 'Poppins' }
                            },
                            grid: { color: '#eee' }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>

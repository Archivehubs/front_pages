<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchiveHubs - Welcome</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .boarding-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            padding: 20px;
            margin: 0;
        }
        
        .logo-container {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .logo-container img {
            max-width: 200px;
            height: auto;
        }
        
        .welcome-text {
            margin-top: 30px;
            font-size: 24px;
            color: #333;
            text-align: center;
        }
        
        .progress-container {
            width: 300px;
            height: 4px;
            background-color: #f3f3f3;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #ffc107;
            border-radius: 10px;
            animation: load 5s linear forwards;
        }
        
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .tagline {
            font-style: italic;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="boarding-container">
        <div class="logo-container">
            <img src="images/Logo.jpg" alt="ArchiveHubs Logo">
        </div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <div class="welcome-text">Welcome to ArchiveHubs</div>
        <p class="tagline">Your Global Diary</p>
    </div>

    <script>
        // Redirect to create-account.html after 5 seconds
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 5000);
    </script>
</body>
</html>

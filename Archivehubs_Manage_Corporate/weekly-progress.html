<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Progress | ENINK Investment LTD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar (active Weekly Progress) -->
    <aside class="sidebar" id="sidebar">
        <!-- Same as home.html, but active sub-nav-item for Weekly Progress -->
        <a href="weekly-progress.html" class="sub-nav-item active">
            <i class="fas fa-clock"></i>
            <span class="nav-text">Weekly Progress</span>
        </a>
        <!-- Other items... -->
    </aside>

    <main class="main-content">
        <div class="insight-section">
            <div class="header">
                <h3>Weekly Progress</h3>
                <a href="home.html">← Professional Dashboard</a>
            </div>
            <p>Complete this week’s tasks to gain new skills and grow as a creator</p>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 0%;"></div>
            </div>
            <span>0% Complete</span>
            <ul class="tasks-list">
                <li class="task-item">
                    <span>Get 3 new followers</span>
                    <span>0/3 followers</span>
                </li>
                <li class="task-item">
                    <span>Create 3 new public posts</span>
                    <span>0/3 Complete</span>
                </li>
                <li class="task-item">
                    <span>Get 5 interactions on your posts</span>
                    <span>0/5 Post interactions</span>
                </li>
            </ul>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
